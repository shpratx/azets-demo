spring:
  application:
    name: alm-ai-service
  # The AI domain owns models and scoring, not reference data, so it carries no relational store.
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration
      - org.springframework.boot.autoconfigure.orm.jpa.HibernateJpaAutoConfiguration
  security:
    oauth2:
      resourceserver:
        jwt:
          # AP-9.3: tokens validated against the enterprise IdP JWKS endpoint.
          issuer-uri: ${OIDC_ISSUER_URI:https://idp.azets.internal/realms/alm}
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP:localhost:9092}
    consumer:
      group-id: alm-ai-service
    producer:
      properties:
        spring.json.add.type.headers: false
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer

server:
  port: 8085
  shutdown: graceful

alm:
  events:
    transport: ${ALM_EVENT_TRANSPORT:kafka}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      probes:
        enabled: true
  metrics:
    tags:
      service: alm-ai-service

logging:
  pattern:
    # LLD 11: correlation id on every log line. Never log legacy account names or file content.
    level: "%5p [${spring.application.name},%X{correlationId:-}]"
