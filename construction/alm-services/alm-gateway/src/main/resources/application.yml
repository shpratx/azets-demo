spring:
  application:
    name: alm-gateway
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${OIDC_ISSUER_URI:https://idp.azets.internal/realms/alm}
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  cloud:
    gateway:
      default-filters:
        # Rate limiting applies to every route; the gateway owns it, no service repeats it.
        - name: RequestRateLimiter
          args:
            redis-rate-limiter.replenishRate: 50
            redis-rate-limiter.burstCapacity: 100
            key-resolver: "#{@principalKeyResolver}"
      routes:
        - id: intake
          uri: ${INTAKE_URI:http://localhost:8081}
          predicates: [ Path=/api/intake/v1/**, ]
          filters: [ RewritePath=/api/intake/v1/(?<seg>.*), /intake/v1/${seg} ]
        - id: mapping
          uri: ${MAPPING_URI:http://localhost:8082}
          predicates: [ Path=/api/mapping/v1/** ]
          filters: [ RewritePath=/api/mapping/v1/(?<seg>.*), /mapping/v1/${seg} ]
        - id: ledger
          uri: ${LEDGER_URI:http://localhost:8083}
          predicates: [ Path=/api/ledger/v1/** ]
          filters: [ RewritePath=/api/ledger/v1/(?<seg>.*), /ledger/v1/${seg} ]
        - id: rules
          uri: ${RULES_URI:http://localhost:8084}
          predicates: [ Path=/api/rules/v1/** ]
          filters: [ RewritePath=/api/rules/v1/(?<seg>.*), /rules/v1/${seg} ]
        - id: ai
          uri: ${AI_URI:http://localhost:8085}
          predicates: [ Path=/api/ai/v1/** ]
          filters: [ RewritePath=/api/ai/v1/(?<seg>.*), /ai/v1/${seg} ]
        - id: review
          uri: ${REVIEW_URI:http://localhost:8086}
          predicates: [ Path=/api/review/v1/** ]
          filters: [ RewritePath=/api/review/v1/(?<seg>.*), /review/v1/${seg} ]
        - id: integration
          uri: ${INTEGRATION_URI:http://localhost:8087}
          predicates: [ Path=/api/integration/v1/** ]
          filters: [ RewritePath=/api/integration/v1/(?<seg>.*), /integration/v1/${seg} ]
        - id: audit
          uri: ${AUDIT_URI:http://localhost:8088}
          predicates: [ Path=/api/audit/v1/** ]
          filters: [ RewritePath=/api/audit/v1/(?<seg>.*), /audit/v1/${seg} ]
        - id: notifications
          uri: ${NOTIFICATION_URI:http://localhost:8089}
          predicates: [ Path=/api/notifications/v1/** ]
          filters: [ RewritePath=/api/notifications/v1/(?<seg>.*), /notifications/v1/${seg} ]

server:
  port: 8080
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,gateway
  endpoint:
    health:
      probes:
        enabled: true
